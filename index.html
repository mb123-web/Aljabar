<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/algebrite/1.4.0/algebrite.bundle-for-browser.js"></script>
    <style>
      body { font-family: sans-serif; padding: 20px; text-align: center; }
      input { padding: 10px; width: 70%; margin-bottom: 10px; }
      button { padding: 10px 20px; cursor: pointer; background: #4285f4; color: white; border: none; }
      #result { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #d93025; }
    </style>
  </head>
  <body>
    <h2>Kalkulator Aljabar</h2>
    <input type="text" id="question" placeholder="Contoh: expand((x + 1)^2) atau simplify(x + x)">
    <br>
    <button onclick="hitung()">Selesaikan!</button>
    
    <div id="result"></div>

    <script>
      function hitung() {
        const input = document.getElementById('question').value;
        const display = document.getElementById('result');
        
        try {
          // Menggunakan Algebrite untuk menghitung
          // eval() di Algebrite akan memproses string matematika
          const hasil = Algebrite.run(input);
          display.innerHTML = "Hasil: " + hasil;
        } catch (err) {
          display.innerHTML = "Error: Pastikan format benar.";
        }
      }
    </script>
  </body>
</html>
